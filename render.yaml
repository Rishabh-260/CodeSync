services:
  - type: web
    name: codesync-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @codesync/api && npm run db:migrate --workspace @codesync/api
    startCommand: npm run start --workspace @codesync/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RUSTBOX_API_KEY
        sync: false
      - key: RUSTBOX_API_URL
        value: https://api.rustbox.sh